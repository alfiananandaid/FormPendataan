<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pengadaan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <!-- LOGIN VIEW -->
    <div id="login-view" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-lg w-96">
            <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">Login Sistem</h2>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">NIK</label>
                <input type="text" id="login-nik" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input type="password" id="login-pass" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>
            <button onclick="login()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full">Login</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard-view" class="hidden min-h-screen">
        <nav class="bg-blue-600 p-4 shadow-md text-white flex justify-between items-center">
            <h1 class="text-xl font-bold">Dashboard Pengadaan</h1>
            <div class="flex items-center gap-4">
                <span id="user-info" class="text-sm font-medium"></span>
                <button onclick="logout()" class="bg-red-500 px-3 py-1 rounded hover:bg-red-700">Logout</button>
            </div>
        </nav>

        <div class="container mx-auto p-4 flex gap-4 mt-4">
            <!-- Sidebar -->
            <div class="w-1/4 bg-white rounded-lg shadow p-4 h-fit">
                <ul class="space-y-2">
                    <li><button onclick="showPage('form-pengadaan')" class="w-full text-left p-2 hover:bg-blue-100 rounded">Form Pengadaan</button></li>
                    <li><button onclick="showPage('data-pengadaan')" class="w-full text-left p-2 hover:bg-blue-100 rounded">Status & Data Pengadaan</button></li>
                    <!-- Admin Menu -->
                    <li id="menu-admin" class="hidden border-t pt-2 mt-2">
                        <span class="text-xs font-bold text-gray-500 uppercase">Admin Area</span>
                        <button onclick="showPage('admin-approval')" class="w-full text-left p-2 hover:bg-blue-100 rounded text-red-600 font-medium">Approve / Reject</button>
                    </li>
                </ul>
            </div>

            <!-- Content Area -->
            <div class="w-3/4 bg-white rounded-lg shadow p-6">
                
                <!-- PAGE: FORM PENGADAAN -->
                <div id="page-form-pengadaan" class="page-content hidden">
                    <h2 class="text-2xl font-bold mb-4 border-b pb-2">Buat Pengadaan Baru</h2>
                    <form id="form-submit" onsubmit="event.preventDefault(); submitPengadaan();">
                        <div class="mb-4">
                            <label class="block text-gray-700 text-sm font-bold mb-2">Pilih Item (List)</label>
                            <select id="item-list" class="shadow border rounded w-full py-2 px-3" onchange="toggleManualInput()">
                                <option value="ATK">ATK</option>
                                <option value="Plastik Kasir">Plastik Kasir</option>
                                <option value="Seragam">Seragam</option>
                                <option value="Lainnya">Lainnya (Input Manual)</option>
                            </select>
                        </div>
                        <div class="mb-4 hidden" id="manual-input-container">
                            <label class="block text-gray-700 text-sm font-bold mb-2">Nama Barang (Manual)</label>
                            <input type="text" id="item-manual" class="shadow border rounded w-full py-2 px-3">
                        </div>
                        
                        <div class="p-4 bg-gray-50 border rounded mb-4">
                            <h3 class="font-bold mb-2">Upload Foto Kondisi/Barang</h3>
                            <div class="mb-3">
                                <label class="block text-sm">Foto 1 (Wajib)</label>
                                <input type="file" id="foto1" accept="image/*" required class="text-sm">
                            </div>
                            <div class="mb-3">
                                <label class="block text-sm">Foto 2 (Opsional)</label>
                                <input type="file" id="foto2" accept="image/*" class="text-sm">
                            </div>
                            <div>
                                <label class="block text-sm">Foto 3 (Opsional)</label>
                                <input type="file" id="foto3" accept="image/*" class="text-sm">
                            </div>
                        </div>

                        <button type="submit" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Kirim Pengadaan</button>
                    </form>
                </div>

                <!-- PAGE: DATA PENGADAAN (STAFF) -->
                <div id="page-data-pengadaan" class="page-content hidden">
                    <h2 class="text-2xl font-bold mb-4 border-b pb-2">Data & Status Pengadaan Saya</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-200">
                                    <th class="p-2 border">ID</th>
                                    <th class="p-2 border">Barang</th>
                                    <th class="p-2 border">Status</th>
                                    <th class="p-2 border">Keterangan</th>
                                </tr>
                            </thead>
                            <tbody id="table-staff-body"></tbody>
                        </table>
                    </div>
                </div>

                <!-- PAGE: ADMIN APPROVAL -->
                <div id="page-admin-approval" class="page-content hidden">
                    <h2 class="text-2xl font-bold mb-4 border-b pb-2">Menunggu Approval (Admin)</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-gray-200">
                                    <th class="p-2 border">Store</th>
                                    <th class="p-2 border">Barang</th>
                                    <th class="p-2 border">Foto</th>
                                    <th class="p-2 border">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="table-admin-body"></tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

<script>
    // --- KONFIGURASI ---
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwQtYAiSMYqXPb8o9aku1Yv74z-99A8QequzgNutpGEkR2pXo2nRQPB5xHyosDs63YG/exec'; // GANTI DENGAN URL GAS ANDA
    
    let currentUser = null;

    // --- UTILITIES ---
    async function apiCall(data) {
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(data)
            });
            return await response.json();
        } catch (error) {
            Swal.fire('Error', 'Terjadi kesalahan koneksi', 'error');
            return {status: 'error'};
        }
    }

    const fileToBase64 = file => new Promise((resolve, reject) => {
        if(!file) return resolve(null);
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });

    // --- LOGIC UI & AUTH ---
    async function login() {
        const nik = document.getElementById('login-nik').value;
        const pass = document.getElementById('login-pass').value;
        
        Swal.fire({ title: 'Tunggu...', didOpen: () => Swal.showLoading() });
        const res = await apiCall({ action: 'login', nik: nik, password: pass });
        
        if (res.status === 'success') {
            currentUser = res.user;
            Swal.close();
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            document.getElementById('user-info').innerText = `${currentUser.nik} - ${currentUser.nama}`;
            
            if (currentUser.role === 'admin') {
                document.getElementById('menu-admin').classList.remove('hidden');
            }
            showPage('form-pengadaan');
        } else {
            Swal.fire('Gagal', res.message, 'error');
        }
    }

    function logout() {
        currentUser = null;
        document.getElementById('dashboard-view').classList.add('hidden');
        document.getElementById('login-view').classList.remove('hidden');
        document.getElementById('menu-admin').classList.add('hidden');
    }

    function showPage(pageId) {
        document.querySelectorAll('.page-content').forEach(el => el.classList.add('hidden'));
        document.getElementById(`page-${pageId}`).classList.remove('hidden');
        if (pageId === 'data-pengadaan') loadDataStaff();
        if (pageId === 'admin-approval') loadDataAdmin();
    }

    function toggleManualInput() {
        const val = document.getElementById('item-list').value;
        document.getElementById('manual-input-container').style.display = val === 'Lainnya' ? 'block' : 'none';
    }

    // --- FITUR STAFF ---
    async function submitPengadaan() {
        const file1 = document.getElementById('foto1').files[0];
        const file2 = document.getElementById('foto2').files[0];
        const file3 = document.getElementById('foto3').files[0];

        Swal.fire({ title: 'Mengupload Data...', text: 'Membuat folder dan menyimpan foto', didOpen: () => Swal.showLoading() });

        const b64_1 = await fileToBase64(file1);
        const b64_2 = await fileToBase64(file2);
        const b64_3 = await fileToBase64(file3);
        
        const payload = {
            action: 'submit_pengadaan',
            nik: currentUser.nik,
            nama: currentUser.nama,
            store: currentUser.store,
            jenis_input: document.getElementById('item-list').value === 'Lainnya' ? 'Manual' : 'List',
            permintaan_list: document.getElementById('item-list').value,
            permintaan_manual: document.getElementById('item-manual').value,
            foto1: b64_1,
            foto2: b64_2,
            foto3: b64_3
        };

        const res = await apiCall(payload);
        if (res.status === 'success') {
            Swal.fire('Berhasil!', res.message, 'success');
            document.getElementById('form-submit').reset();
            showPage('data-pengadaan');
        }
    }

    async function loadDataStaff() {
        const tbody = document.getElementById('table-staff-body');
        tbody.innerHTML = '<tr><td colspan="4" class="text-center p-4">Loading...</td></tr>';
        
        const res = await apiCall({ action: 'get_data' });
        if (res.status === 'success') {
            tbody.innerHTML = '';
            // Filter hanya data milik user ini
            const myData = res.data.filter(d => d.NIK.toString() === currentUser.nik.toString());
            myData.forEach(d => {
                let badgeColor = d.Status === 'Pending' ? 'bg-yellow-200' : (d.Status === 'Approved' ? 'bg-green-200' : 'bg-red-200');
                tbody.innerHTML += `
                    <tr>
                        <td class="p-2 border text-xs">${d.ID_Pengadaan}</td>
                        <td class="p-2 border font-bold">${d.Permintaan}</td>
                        <td class="p-2 border"><span class="px-2 py-1 rounded text-xs ${badgeColor}">${d.Status}</span></td>
                        <td class="p-2 border text-sm">${d.Keterangan_Admin || '-'}</td>
                    </tr>`;
            });
        }
    }

    // --- FITUR ADMIN ---
    async function loadDataAdmin() {
        const tbody = document.getElementById('table-admin-body');
        tbody.innerHTML = '<tr><td colspan="4" class="text-center p-4">Loading...</td></tr>';
        
        const res = await apiCall({ action: 'get_data' });
        if (res.status === 'success') {
            tbody.innerHTML = '';
            const pendingData = res.data.filter(d => d.Status === 'Pending');
            pendingData.forEach(d => {
                let fotoLinks = `<a href="${d.Foto_1}" target="_blank" class="text-blue-500 underline text-xs">F1</a> `;
                if(d.Foto_2) fotoLinks += `| <a href="${d.Foto_2}" target="_blank" class="text-blue-500 underline text-xs">F2</a> `;
                if(d.Foto_3) fotoLinks += `| <a href="${d.Foto_3}" target="_blank" class="text-blue-500 underline text-xs">F3</a>`;
                
                tbody.innerHTML += `
                    <tr>
                        <td class="p-2 border"><b>${d.Store}</b><br><span class="text-xs text-gray-500">${d.Nama} (${d.NIK})</span></td>
                        <td class="p-2 border">${d.Permintaan}</td>
                        <td class="p-2 border">${fotoLinks}</td>
                        <td class="p-2 border text-center space-y-1">
                            <button onclick="actionAdmin('${d.ID_Pengadaan}', 'Approved')" class="bg-green-500 text-white px-2 py-1 rounded text-xs w-full">Approve</button>
                            <button onclick="actionAdmin('${d.ID_Pengadaan}', 'Rejected')" class="bg-red-500 text-white px-2 py-1 rounded text-xs w-full">Reject</button>
                        </td>
                    </tr>`;
            });
            if(pendingData.length === 0) tbody.innerHTML = '<tr><td colspan="4" class="text-center p-4">Tidak ada request pending.</td></tr>';
        }
    }

    async function actionAdmin(id, status) {
        const { value: keterangan } = await Swal.fire({
            title: `Berikan keterangan untuk ${status}`,
            input: 'text',
            inputPlaceholder: 'Masukkan keterangan / alasan...',
            showCancelButton: true
        });

        if (keterangan !== undefined) {
            Swal.fire({ title: 'Menyimpan...', didOpen: () => Swal.showLoading() });
            const res = await apiCall({ action: 'update_status', id: id, status: status, keterangan: keterangan });
            if (res.status === 'success') {
                Swal.fire('Berhasil!', `Status diupdate menjadi ${status}`, 'success');
                loadDataAdmin();
            }
        }
    }
</script>
</body>
</html>
