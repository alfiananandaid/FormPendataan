<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Pengadaan</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #F2F2F7; -webkit-tap-highlight-color: transparent;}
        .ios-card { background: white; border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); padding: 24px; }
        .ios-input { background: #F2F2F7; border: none; border-radius: 14px; padding: 14px 16px; width: 100%; outline: none; transition: 0.2s;}
        .ios-input:focus { box-shadow: 0 0 0 2px #007AFF; }
        .ios-btn { background: #007AFF; color: white; border-radius: 14px; padding: 14px; width: 100%; font-weight: 600; font-size: 16px; transition: 0.2s;}
        .ios-btn:active { transform: scale(0.97); opacity: 0.9; }
        .ios-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .bottom-nav { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border-top: 1px solid #E5E5EA; }
        .nav-item { color: #8E8E93; transition: 0.2s; }
        .nav-item.active { color: #007AFF; font-weight: 600; }
        .hidden { display: none !important; }
        .status-badge { padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; }
    </style>
</head>
<body class="text-gray-800 pb-20">

    <!-- LOGIN SCREEN -->
    <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
        <div class="ios-card w-full max-w-sm">
            <div class="text-center mb-8">
                <i class="fa-solid fa-box-open text-5xl text-blue-500 mb-3"></i>
                <h2 class="text-2xl font-bold">Pengadaan App</h2>
                <p class="text-sm text-gray-500 mt-1">Sistem Request Barang Terpadu</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="login-nik" class="ios-input" placeholder="Nomor NIK">
                <input type="password" id="login-pass" class="ios-input" placeholder="Password">
                <button id="btn-login" onclick="login()" class="ios-btn mt-4">Masuk</button>
            </div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard-view" class="hidden">
        
        <!-- Header -->
        <div class="bg-white px-6 pt-10 pb-4 shadow-sm sticky top-0 z-10 rounded-b-[24px]">
            <h1 id="page-title" class="text-2xl font-bold">Form Pengajuan</h1>
            <p id="user-store-info" class="text-xs text-gray-500 mt-1"><i class="fa-solid fa-location-dot"></i> Mendapatkan lokasi...</p>
        </div>

        <!-- CONTENT AREA -->
        <div class="p-4 max-w-lg mx-auto">
            
            <!-- PAGE: FORM PENGADAAN -->
            <div id="page-form-pengadaan" class="page-content ios-card">
                <form id="form-submit" onsubmit="event.preventDefault(); submitPengadaan();">
                    <input type="hidden" id="edit-id-pengadaan" value="">
                    <div class="mb-5">
                        <label class="block text-sm font-semibold mb-2 ml-1">Pilih Item Barang</label>
                        <select id="item-list" class="ios-input" onchange="toggleManualInput()">
                            <option value="ATK">ATK</option>
                            <option value="Plastik Kasir">Plastik Kasir</option>
                            <option value="Seragam">Seragam</option>
                            <option value="Lainnya">Lainnya (Input Manual)</option>
                        </select>
                    </div>
                    
                    <div class="mb-5 hidden" id="manual-input-container">
                        <label class="block text-sm font-semibold mb-2 ml-1">Nama Barang Lengkap</label>
                        <input type="text" id="item-manual" class="ios-input" placeholder="Misal: Tinta Printer Epson">
                    </div>
                    
                    <div class="bg-gray-50 p-4 rounded-2xl mb-6 border border-gray-100">
                        <h3 class="font-semibold text-sm mb-3 text-blue-600"><i class="fa-solid fa-camera"></i> Upload Foto</h3>
                        <div class="mb-3">
                            <label class="block text-xs mb-1 font-medium text-gray-500">Foto 1 (Wajib)</label>
                            <input type="file" id="foto1" accept="image/*" class="ios-input bg-white p-2 text-sm" required>
                        </div>
                        <div class="mb-3">
                            <label class="block text-xs mb-1 font-medium text-gray-500">Foto 2 (Opsional)</label>
                            <input type="file" id="foto2" accept="image/*" class="ios-input bg-white p-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs mb-1 font-medium text-gray-500">Foto 3 (Opsional)</label>
                            <input type="file" id="foto3" accept="image/*" class="ios-input bg-white p-2 text-sm">
                        </div>
                    </div>

                    <button type="submit" id="btn-submit" class="ios-btn bg-blue-500"><i class="fa-solid fa-paper-plane mr-2"></i> Kirim Pengajuan</button>
                    <button type="button" id="btn-cancel-edit" onclick="cancelEdit()" class="ios-btn bg-gray-400 mt-3 hidden">Batal Edit</button>
                </form>
            </div>

            <!-- PAGE: HISTORY DATA -->
            <div id="page-data-pengadaan" class="page-content hidden space-y-4">
                <div id="list-history-container">
                    <!-- Data will be loaded here -->
                </div>
            </div>

        </div>

        <!-- BOTTOM NAVIGATION (iOS Style) -->
        <div class="bottom-nav fixed bottom-0 left-0 w-full flex justify-around p-3 pb-6 max-w-lg mx-auto right-0">
            <button onclick="switchTab('form-pengadaan')" id="nav-form-pengadaan" class="nav-item active flex flex-col items-center w-1/3">
                <i class="fa-solid fa-pen-to-square text-xl mb-1"></i>
                <span class="text-[10px]">Buat</span>
            </button>
            <button onclick="switchTab('data-pengadaan')" id="nav-data-pengadaan" class="nav-item flex flex-col items-center w-1/3">
                <i class="fa-solid fa-clock-rotate-left text-xl mb-1"></i>
                <span class="text-[10px]">Histori</span>
            </button>
            <!-- Admin Menu -->
            <button onclick="switchTab('admin-approval')" id="nav-admin" class="nav-item hidden flex flex-col items-center w-1/3 text-red-500">
                <i class="fa-solid fa-clipboard-check text-xl mb-1"></i>
                <span class="text-[10px]">Admin</span>
            </button>
            <button onclick="logout()" class="nav-item flex flex-col items-center w-1/3">
                <i class="fa-solid fa-arrow-right-from-bracket text-xl mb-1"></i>
                <span class="text-[10px]">Keluar</span>
            </button>
        </div>
    </div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyR3OYvo6bYXWGddrF2kEmtW87ReafgursLTCUZKH93Qg9wE7hHK_8-Z2Vl8BMTjX-o/exec'; 
    let currentUser = null;
    let globalIP = 'Menunggu IP...';
    let globalLoc = 'Menunggu Lokasi...';

    // --- INIT LOC & IP ---
    async function initTrackers() {
        try { const res = await fetch('https://api.ipify.org?format=json'); globalIP = (await res.json()).ip; } catch(e) { globalIP = 'Unknown IP'; }
        navigator.geolocation.getCurrentPosition(
            pos => { globalLoc = `${pos.coords.latitude}, ${pos.coords.longitude} (Maps)`; },
            err => { globalLoc = 'Akses Lokasi Ditolak'; }
        );
    }
    initTrackers();

    // --- API CALLER ---
    async function apiCall(data) {
        try {
            const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
            return await response.json();
        } catch (error) {
            return {status: 'error', message: 'Koneksi terputus. Silakan coba lagi.'};
        }
    }

    // --- IMAGE COMPRESSION (MEMPERCEPAT UPLOAD) ---
    function compressImage(file) {
        return new Promise((resolve) => {
            if (!file) return resolve(null);
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; // Kompres ukuran maksimal 800px (Sangat Cepat)
                    let width = img.width, height = img.height;
                    if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7)); // Kualitas 70%
                };
            };
        });
    }

    // --- AUTH ---
    async function login() {
        const btn = document.getElementById('btn-login');
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Loading...';
        btn.disabled = true;
        
        const payload = { action: 'login', nik: document.getElementById('login-nik').value, password: document.getElementById('login-pass').value, ip: globalIP, lokasi: globalLoc };
        const res = await apiCall(payload);
        
        btn.innerHTML = 'Masuk'; btn.disabled = false;
        
        if (res.status === 'success') {
            currentUser = res.user;
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            document.getElementById('user-store-info').innerHTML = `<i class="fa-solid fa-store"></i> ${currentUser.store} <br><i class="fa-solid fa-map-pin mt-1"></i> ${globalLoc}`;
            if (currentUser.role === 'admin') document.getElementById('nav-admin').classList.remove('hidden');
            switchTab('form-pengadaan');
        } else {
            Swal.fire({ icon: 'error', title: 'Gagal', text: res.message, confirmButtonColor: '#007AFF', shape: 'border-radius: 20px' });
        }
    }

    function logout() {
        currentUser = null;
        document.getElementById('dashboard-view').classList.add('hidden');
        document.getElementById('login-view').classList.remove('hidden');
    }

    // --- NAVIGATION ---
    function switchTab(tabId) {
        document.querySelectorAll('.page-content').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        
        if(tabId === 'admin-approval') {
            document.getElementById('page-data-pengadaan').classList.remove('hidden');
            document.getElementById('nav-admin').classList.add('active');
            document.getElementById('page-title').innerText = "Approval Admin";
            loadData(true); // Load admin data
        } else {
            document.getElementById(`page-${tabId}`).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).classList.add('active');
            if (tabId === 'data-pengadaan') {
                document.getElementById('page-title').innerText = "Histori Pengajuan";
                loadData(false); // Load staff data
            } else {
                document.getElementById('page-title').innerText = "Form Pengajuan";
            }
        }
    }

    function toggleManualInput() {
        const val = document.getElementById('item-list').value;
        document.getElementById('manual-input-container').style.display = val === 'Lainnya' ? 'block' : 'none';
        document.getElementById('item-manual').required = val === 'Lainnya';
    }

    // --- SUBMIT / EDIT ---
    async function submitPengadaan() {
        const btn = document.getElementById('btn-submit');
        const editId = document.getElementById('edit-id-pengadaan').value;
        
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';
        btn.disabled = true;

        const f1 = await compressImage(document.getElementById('foto1').files[0]);
        const f2 = await compressImage(document.getElementById('foto2').files[0]);
        const f3 = await compressImage(document.getElementById('foto3').files[0]);
        
        const isManual = document.getElementById('item-list').value === 'Lainnya';

        const payload = {
            action: editId ? 'edit_pengadaan' : 'submit_pengadaan',
            id_pengadaan: editId,
            nik: currentUser.nik, nama: currentUser.nama, store: currentUser.store,
            jenis_input: isManual ? 'Manual' : 'List',
            permintaan_list: document.getElementById('item-list').value,
            permintaan_manual: document.getElementById('item-manual').value,
            foto1: f1, foto2: f2, foto3: f3,
            ip: globalIP, lokasi: globalLoc
        };

        const res = await apiCall(payload);
        btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> Kirim Pengajuan';
        btn.disabled = false;

        if (res.status === 'success') {
            Swal.fire({ icon: 'success', title: 'Berhasil!', text: res.message, timer: 2000, showConfirmButton: false });
            cancelEdit(); // Reset form
            switchTab('data-pengadaan');
        } else {
            Swal.fire({ icon: 'error', title: 'Gagal', text: res.message });
        }
    }

    // --- DATA DISPLAY & 10 MINUTE LOGIC ---
    async function loadData(isAdmin) {
        const container = document.getElementById('list-history-container');
        container.innerHTML = '<div class="text-center p-10"><i class="fa-solid fa-circle-notch fa-spin text-3xl text-blue-500"></i><p class="mt-2 text-gray-500">Memuat Data...</p></div>';
        
        const res = await apiCall({ action: 'get_data' });
        if (res.status === 'success') {
            container.innerHTML = '';
            // Filter: Admin lihat semua Pending (atau semua), Staff HANYA lihat SESUAI STORE NYA
            let displayData = isAdmin 
                ? res.data.filter(d => d.Status === 'Pending') 
                : res.data.filter(d => d.Store === currentUser.store);

            if(displayData.length === 0) {
                container.innerHTML = '<div class="text-center p-10 text-gray-400"><i class="fa-solid fa-folder-open text-4xl mb-3"></i><p>Tidak ada data.</p></div>';
                return;
            }

            const now = new Date().getTime();

            displayData.forEach(d => {
                let badgeColor = d.Status === 'Pending' ? 'bg-yellow-100 text-yellow-700' : (d.Status === 'Approved' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700');
                
                // Cek apakah waktu masih di bawah 10 menit (khusus pengajuan sendiri, status pending)
                let reqTime = new Date(d.Waktu).getTime();
                let isEditable = !isAdmin && (d.NIK == currentUser.nik) && (d.Status === 'Pending') && ((now - reqTime) <= 600000); // 10 menit
                
                let btnEditHtml = isEditable ? `<button onclick="startEdit('${d.ID_Pengadaan}', '${d.Permintaan}', '${d.Jenis_Input}')" class="mt-3 text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg w-full font-medium"><i class="fa-solid fa-pen mr-1"></i> Edit (Sisa waktu: ${Math.floor((600000-(now-reqTime))/60000)} mnt)</button>` : '';
                
                let btnAdminHtml = isAdmin ? `
                    <div class="flex gap-2 mt-3 pt-3 border-t">
                        <button onclick="actionAdmin('${d.ID_Pengadaan}', 'Approved')" class="bg-green-500 text-white rounded-lg px-3 py-2 text-xs font-bold w-1/2">Approve</button>
                        <button onclick="actionAdmin('${d.ID_Pengadaan}', 'Rejected')" class="bg-red-500 text-white rounded-lg px-3 py-2 text-xs font-bold w-1/2">Reject</button>
                    </div>` : '';

                container.innerHTML += `
                    <div class="ios-card mb-4 relative">
                        <span class="absolute top-4 right-4 status-badge ${badgeColor}">${d.Status}</span>
                        <p class="text-xs text-gray-400 mb-1">${new Date(d.Waktu).toLocaleString('id-ID')}</p>
                        <h3 class="font-bold text-lg leading-tight mb-1">${d.Permintaan}</h3>
                        ${isAdmin ? `<p class="text-xs text-blue-600 font-medium mb-2"><i class="fa-solid fa-store"></i> ${d.Store} (${d.Nama})</p>` : ''}
                        
                        <div class="flex gap-3 mt-3">
                            <a href="${d.Foto_1}" target="_blank" class="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center text-blue-500 text-xs shadow-sm"><i class="fa-solid fa-image"></i></a>
                            ${d.Foto_2 ? `<a href="${d.Foto_2}" target="_blank" class="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center text-blue-500 text-xs shadow-sm"><i class="fa-solid fa-image"></i></a>` : ''}
                            ${d.Foto_3 ? `<a href="${d.Foto_3}" target="_blank" class="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center text-blue-500 text-xs shadow-sm"><i class="fa-solid fa-image"></i></a>` : ''}
                        </div>
                        
                        ${d.Keterangan_Admin ? `<div class="mt-3 bg-gray-50 p-2 rounded-lg text-xs border"><span class="font-bold">Ket Admin:</span> ${d.Keterangan_Admin}</div>` : ''}
                        ${btnEditHtml}
                        ${btnAdminHtml}
                    </div>`;
            });
        }
    }

    // --- ACTION EDIT & ADMIN ---
    function startEdit(id, permintaan, jenis) {
        switchTab('form-pengadaan');
        document.getElementById('edit-id-pengadaan').value = id;
        document.getElementById('page-title').innerText = "Edit Pengajuan (Maks 10 Mnt)";
        document.getElementById('btn-submit').innerHTML = '<i class="fa-solid fa-floppy-disk mr-2"></i> Simpan Perubahan';
        document.getElementById('btn-submit').classList.replace('bg-blue-500', 'bg-orange-500');
        document.getElementById('btn-cancel-edit').classList.remove('hidden');
        document.getElementById('foto1').required = false; // Saat edit foto tdk wajib diisi ulang
        
        if (jenis === 'Manual') {
            document.getElementById('item-list').value = 'Lainnya';
            document.getElementById('item-manual').value = permintaan;
        } else {
            document.getElementById('item-list').value = permintaan;
        }
        toggleManualInput();
        Swal.fire({icon: 'info', title: 'Mode Edit', text: 'Jika Anda tidak mengupload foto baru, foto lama akan dipertahankan.', timer:3000});
    }

    function cancelEdit() {
        document.getElementById('form-submit').reset();
        document.getElementById('edit-id-pengadaan').value = "";
        document.getElementById('page-title').innerText = "Form Pengajuan";
        document.getElementById('btn-submit').innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> Kirim Pengajuan';
        document.getElementById('btn-submit').classList.replace('bg-orange-500', 'bg-blue-500');
        document.getElementById('btn-cancel-edit').classList.add('hidden');
        document.getElementById('foto1').required = true;
        toggleManualInput();
    }

    async function actionAdmin(id, status) {
        const { value: ket } = await Swal.fire({
            title: status,
            input: 'text',
            inputPlaceholder: 'Masukkan keterangan...',
            showCancelButton: true,
            confirmButtonColor: status === 'Approved' ? '#22c55e' : '#ef4444'
        });

        if (ket !== undefined) {
            Swal.fire({ title: 'Memproses...', didOpen: () => Swal.showLoading() });
            const res = await apiCall({ action: 'update_status', id: id, status: status, keterangan: ket, nik: currentUser.nik, nama: currentUser.nama, ip: globalIP, lokasi: globalLoc });
            if (res.status === 'success') {
                Swal.fire('Berhasil!', `Status diupdate menjadi ${status}`, 'success');
                loadData(true);
            }
        }
    }
</script>
</body>
</html>
