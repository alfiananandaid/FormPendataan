<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Pengadaan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #F2F2F7; -webkit-tap-highlight-color: transparent;}
        .ios-card { background: white; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); padding: 20px; border: 1px solid #f0f0f0;}
        .ios-input { background: #F7F7F9; border: 1px solid #E5E5EA; border-radius: 12px; padding: 12px 14px; width: 100%; outline: none; transition: 0.2s;}
        .ios-input:focus { border-color: #007AFF; box-shadow: 0 0 0 3px rgba(0,122,255,0.1); background: white;}
        .ios-btn { background: #007AFF; color: white; border-radius: 14px; padding: 14px; width: 100%; font-weight: 600; transition: 0.2s;}
        .ios-btn:active { transform: scale(0.97); }
        .ios-btn:disabled { opacity: 0.5; }
        .photo-box { aspect-ratio: 1/1; border: 2px dashed #D1D1D6; border-radius: 14px; display: flex; flex-direction: column; justify-content: center; items-center: center; background: #FAFAFC; cursor: pointer; position: relative; overflow: hidden; transition: 0.2s;}
        .photo-box:active { background: #E5E5EA; }
        .photo-preview { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 10; }
        .btn-remove-photo { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.6); color: white; border-radius: 50%; width: 24px; height: 24px; z-index: 20; display: flex; align-items: center; justify-content: center; border: 2px solid white;}
        .bottom-nav { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-top: 1px solid #E5E5EA; }
        .nav-item { color: #8E8E93; transition: 0.2s; }
        .nav-item.active { color: #007AFF; font-weight: 600; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="text-gray-800 pb-20">

    <!-- LOGIN -->
    <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
        <div class="ios-card w-full max-w-sm">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 text-3xl"><i class="fa-solid fa-box"></i></div>
                <h2 class="text-2xl font-bold">Pengadaan Apps</h2>
            </div>
            <div class="space-y-4">
                <input type="text" id="login-nik" class="ios-input" placeholder="Nomor NIK">
                <input type="password" id="login-pass" class="ios-input" placeholder="Password">
                <button id="btn-login" onclick="login()" class="ios-btn mt-2">Masuk</button>
            </div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-view" class="hidden">
        <div class="bg-white px-6 pt-10 pb-4 shadow-sm sticky top-0 z-30 rounded-b-[20px]">
            <h1 id="page-title" class="text-2xl font-bold">Form Pengajuan</h1>
            <p id="user-store-info" class="text-xs text-gray-500 mt-1"></p>
        </div>

        <div class="p-4 max-w-lg mx-auto">
            
            <!-- FORM PENGADAAN -->
            <div id="page-form-pengadaan" class="page-content ios-card">
                <form id="form-submit" onsubmit="event.preventDefault(); submitPengadaan();">
                    <input type="hidden" id="edit-id-pengadaan" value="">
                    
                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-1 ml-1">Kategori / Nama Barang</label>
                        <select id="item-list" class="ios-input" onchange="toggleManualInput()">
                            <option value="">Memuat list dari sistem...</option>
                        </select>
                    </div>
                    
                    <div class="mb-4 hidden" id="manual-input-container">
                        <label class="block text-sm font-semibold mb-1 ml-1 text-blue-600">Nama Barang (Input Manual)</label>
                        <input type="text" id="item-manual" class="ios-input border-blue-200" placeholder="Ketik nama barang disini...">
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-1 ml-1">Deskripsi & Keterangan <span class="text-red-500">*</span></label>
                        <textarea id="deskripsi" class="ios-input min-h-[80px]" required placeholder="Cth: Butuh ukuran L 2 pcs, warna hitam. Kondisi stok saat ini kosong."></textarea>
                    </div>
                    
                    <!-- FOTO UPLOAD SEJAJAR 3 -->
                    <div class="mb-6">
                        <label class="block text-sm font-semibold mb-2 ml-1">Upload Foto Bukti/Kondisi</label>
                        <div class="grid grid-cols-3 gap-3">
                            <!-- FOTO 1 (Wajib) -->
                            <div class="photo-box text-center" onclick="document.getElementById('foto1').click()">
                                <i class="fa-solid fa-camera text-gray-400 text-xl mb-1"></i>
                                <span class="text-[10px] font-medium text-gray-500">Foto 1 <span class="text-red-500">*</span></span>
                                <img id="preview1" class="photo-preview hidden">
                                <button type="button" id="btn-hapus-1" class="btn-remove-photo hidden" onclick="event.stopPropagation(); removePhoto(1)"><i class="fa-solid fa-xmark text-xs"></i></button>
                            </div>
                            <input type="file" id="foto1" accept="image/*" class="hidden" onchange="handlePhoto(this, 1)" required>

                            <!-- FOTO 2 -->
                            <div class="photo-box text-center" onclick="document.getElementById('foto2').click()">
                                <i class="fa-solid fa-camera text-gray-400 text-xl mb-1"></i>
                                <span class="text-[10px] font-medium text-gray-500">Foto 2 (Ops)</span>
                                <img id="preview2" class="photo-preview hidden">
                                <button type="button" id="btn-hapus-2" class="btn-remove-photo hidden" onclick="event.stopPropagation(); removePhoto(2)"><i class="fa-solid fa-xmark text-xs"></i></button>
                            </div>
                            <input type="file" id="foto2" accept="image/*" class="hidden" onchange="handlePhoto(this, 2)">

                            <!-- FOTO 3 -->
                            <div class="photo-box text-center" onclick="document.getElementById('foto3').click()">
                                <i class="fa-solid fa-camera text-gray-400 text-xl mb-1"></i>
                                <span class="text-[10px] font-medium text-gray-500">Foto 3 (Ops)</span>
                                <img id="preview3" class="photo-preview hidden">
                                <button type="button" id="btn-hapus-3" class="btn-remove-photo hidden" onclick="event.stopPropagation(); removePhoto(3)"><i class="fa-solid fa-xmark text-xs"></i></button>
                            </div>
                            <input type="file" id="foto3" accept="image/*" class="hidden" onchange="handlePhoto(this, 3)">
                        </div>
                    </div>

                    <button type="submit" id="btn-submit" class="ios-btn bg-blue-600"><i class="fa-solid fa-paper-plane mr-2"></i> Kirim Pengajuan</button>
                    <button type="button" id="btn-cancel-edit" onclick="cancelEdit()" class="ios-btn bg-gray-200 text-gray-700 mt-3 hidden">Batal Edit</button>
                </form>
            </div>

            <!-- PAGE: HISTORY DATA -->
            <div id="page-data-pengadaan" class="page-content hidden space-y-4">
                <div id="list-history-container"></div>
            </div>
        </div>

        <!-- BOTTOM NAV -->
        <div class="bottom-nav fixed bottom-0 left-0 w-full flex justify-around p-3 pb-6 z-40">
            <button onclick="switchTab('form-pengadaan')" id="nav-form-pengadaan" class="nav-item active flex flex-col items-center w-1/4">
                <i class="fa-solid fa-pen-to-square text-xl mb-1"></i>
                <span class="text-[10px]">Buat</span>
            </button>
            <button onclick="switchTab('data-pengadaan')" id="nav-data-pengadaan" class="nav-item flex flex-col items-center w-1/4">
                <i class="fa-solid fa-clock-rotate-left text-xl mb-1"></i>
                <span class="text-[10px]">Histori</span>
            </button>
            <button onclick="switchTab('admin-approval')" id="nav-admin" class="nav-item hidden flex flex-col items-center w-1/4 text-red-500">
                <i class="fa-solid fa-clipboard-check text-xl mb-1"></i>
                <span class="text-[10px]">Admin</span>
            </button>
            <button onclick="logout()" class="nav-item flex flex-col items-center w-1/4">
                <i class="fa-solid fa-power-off text-xl mb-1"></i>
                <span class="text-[10px]">Keluar</span>
            </button>
        </div>
    </div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz3Mrk_66n7XNloFNmRxsZopgTHOhtY5nkHFiz6p6MmEDdxrnCIFo_4pUb4eQZos6-1/exec'; 
    let currentUser = null, globalIP = 'Unknown', globalLoc = 'Akses Lokasi Ditolak';

    // Init Trackers
    fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>globalIP=d.ip).catch(e=>{});
    navigator.geolocation.getCurrentPosition(p=>globalLoc=`${p.coords.latitude}, ${p.coords.longitude}`, e=>{});

    async function apiCall(data) {
        try { return await (await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) })).json(); } 
        catch (err) { return {status: 'error', message: 'Koneksi error.'}; }
    }

    // PREVIEW FOTO
    function handlePhoto(input, num) {
        const file = input.files[0];
        if (file) {
            document.getElementById('preview' + num).src = URL.createObjectURL(file);
            document.getElementById('preview' + num).classList.remove('hidden');
            document.getElementById('btn-hapus-' + num).classList.remove('hidden');
        }
    }

    // REMOVE FOTO
    function removePhoto(num) {
        document.getElementById('foto' + num).value = '';
        document.getElementById('preview' + num).src = '';
        document.getElementById('preview' + num).classList.add('hidden');
        document.getElementById('btn-hapus-' + num).classList.add('hidden');
    }

    function compressImage(file) {
        return new Promise((resolve) => {
            if (!file) return resolve(null);
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > 800) { h = Math.round((h * 800) / w); w = 800; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', 0.7)); 
                };
            };
        });
    }

    // LOAD MASTER BARANG
    async function initSystemData() {
        const res = await apiCall({action: 'init_data'});
        if(res.status === 'success') {
            const select = document.getElementById('item-list');
            select.innerHTML = '<option value="" disabled selected>-- Pilih Barang --</option>';
            res.master_barang.forEach(item => { select.innerHTML += `<option value="${item}">${item}</option>`; });
            select.innerHTML += `<option value="Lainnya" class="font-bold text-blue-600">➕ Lainnya (Ketik Manual)</option>`;
        }
    }
    initSystemData();

    async function login() {
        const btn = document.getElementById('btn-login');
        btn.innerHTML = 'Loading...'; btn.disabled = true;
        
        const res = await apiCall({ action: 'login', nik: document.getElementById('login-nik').value, password: document.getElementById('login-pass').value, ip: globalIP, lokasi: globalLoc });
        btn.innerHTML = 'Masuk'; btn.disabled = false;
        
        if (res.status === 'success') {
            currentUser = res.user;
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            document.getElementById('user-store-info').innerHTML = `<i class="fa-solid fa-store text-blue-500"></i> ${currentUser.store}`;
            if (currentUser.role === 'admin') document.getElementById('nav-admin').classList.remove('hidden');
            switchTab('form-pengadaan');
        } else Swal.fire('Gagal', res.message, 'error');
    }

    function logout() { location.reload(); }

    function switchTab(tabId) {
        document.querySelectorAll('.page-content').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if(tabId === 'admin-approval') {
            document.getElementById('page-data-pengadaan').classList.remove('hidden');
            document.getElementById('nav-admin').classList.add('active');
            document.getElementById('page-title').innerText = "Approval Admin";
            loadData(true);
        } else {
            document.getElementById(`page-${tabId}`).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).classList.add('active');
            document.getElementById('page-title').innerText = tabId === 'data-pengadaan' ? "Histori Pengajuan" : "Form Pengajuan";
            if (tabId === 'data-pengadaan') loadData(false);
        }
    }

    function toggleManualInput() {
        const isLainnya = document.getElementById('item-list').value === 'Lainnya';
        document.getElementById('manual-input-container').style.display = isLainnya ? 'block' : 'none';
        document.getElementById('item-manual').required = isLainnya;
    }

    async function submitPengadaan() {
        const btn = document.getElementById('btn-submit');
        const editId = document.getElementById('edit-id-pengadaan').value;
        btn.innerHTML = 'Memproses...'; btn.disabled = true;

        const p = {
            action: editId ? 'edit_pengadaan' : 'submit_pengadaan', id_pengadaan: editId,
            nik: currentUser.nik, nama: currentUser.nama, store: currentUser.store,
            jenis_input: document.getElementById('item-list').value === 'Lainnya' ? 'Manual' : 'List',
            permintaan_list: document.getElementById('item-list').value,
            permintaan_manual: document.getElementById('item-manual').value,
            deskripsi: document.getElementById('deskripsi').value,
            foto1: await compressImage(document.getElementById('foto1').files[0]),
            foto2: await compressImage(document.getElementById('foto2').files[0]),
            foto3: await compressImage(document.getElementById('foto3').files[0]),
            ip: globalIP, lokasi: globalLoc
        };

        const res = await apiCall(p);
        btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> Kirim Pengajuan'; btn.disabled = false;

        if (res.status === 'success') {
            Swal.fire({ icon: 'success', title: 'Berhasil!', text: res.message, timer: 2000, showConfirmButton: false });
            cancelEdit(); switchTab('data-pengadaan');
        } else Swal.fire('Gagal', res.message, 'error');
    }

    async function loadData(isAdmin) {
        const container = document.getElementById('list-history-container');
        container.innerHTML = '<div class="text-center p-10 text-gray-500">Memuat Data...</div>';
        const res = await apiCall({ action: 'get_data' });
        
        if (res.status === 'success') {
            let data = isAdmin ? res.data.filter(d => d.Status === 'Pending') : res.data.filter(d => d.Store === currentUser.store);
            if(data.length === 0) return container.innerHTML = '<div class="text-center p-10 text-gray-400">Tidak ada data.</div>';

            container.innerHTML = '';
            data.forEach(d => {
                let badge = d.Status === 'Pending' ? 'bg-yellow-100 text-yellow-700' : (d.Status === 'Approved' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700');
                let timeValid = (new Date().getTime() - new Date(d.Waktu).getTime()) <= 600000;
                let btnEdit = (!isAdmin && d.Status === 'Pending' && timeValid) ? `<button onclick="startEdit('${d.ID_Pengadaan}', '${d.Permintaan}', '${d.Jenis_Input}', '${d.Deskripsi_Detail}')" class="mt-2 text-xs bg-gray-100 text-gray-700 px-3 py-2 rounded-xl w-full font-bold">Edit Pengajuan (Maks 10 Mnt)</button>` : '';
                let btnAdmin = isAdmin ? `<div class="flex gap-2 mt-3"><button onclick="actionAdmin('${d.ID_Pengadaan}', 'Approved')" class="bg-green-500 text-white rounded-xl px-3 py-2 text-xs font-bold w-1/2">Approve</button><button onclick="actionAdmin('${d.ID_Pengadaan}', 'Rejected')" class="bg-red-500 text-white rounded-xl px-3 py-2 text-xs font-bold w-1/2">Reject</button></div>` : '';

                let fotos = `<a href="${d.Foto_1}" target="_blank" class="w-10 h-10 bg-gray-100 rounded-lg flex items-center justify-center text-blue-500 shadow-sm"><i class="fa-solid fa-image"></i></a>`;
                if(d.Foto_2) fotos += `<a href="${d.Foto_2}" target="_blank" class="w-10 h-10 bg-gray-100 rounded-lg flex items-center justify-center text-blue-500 shadow-sm"><i class="fa-solid fa-image"></i></a>`;
                if(d.Foto_3) fotos += `<a href="${d.Foto_3}" target="_blank" class="w-10 h-10 bg-gray-100 rounded-lg flex items-center justify-center text-blue-500 shadow-sm"><i class="fa-solid fa-image"></i></a>`;

                container.innerHTML += `
                    <div class="ios-card mb-4 relative">
                        <span class="absolute top-4 right-4 text-[10px] font-bold px-2 py-1 rounded-md ${badge}">${d.Status}</span>
                        <h3 class="font-bold text-lg pr-16">${d.Permintaan}</h3>
                        <p class="text-xs text-gray-500 mt-1">${new Date(d.Waktu).toLocaleString('id-ID')}</p>
                        ${isAdmin ? `<p class="text-xs text-blue-600 mt-1"><i class="fa-solid fa-store"></i> ${d.Store}</p>` : ''}
                        
                        <div class="bg-gray-50 border p-3 rounded-xl mt-3 mb-3">
                            <p class="text-xs font-semibold text-gray-700 mb-1">Deskripsi:</p>
                            <p class="text-xs text-gray-600">${d.Deskripsi_Detail}</p>
                        </div>
                        
                        <div class="flex gap-2">${fotos}</div>
                        ${d.Keterangan_Admin ? `<div class="mt-3 text-xs text-red-600 font-medium">Ket Admin: ${d.Keterangan_Admin}</div>` : ''}
                        ${btnEdit} ${btnAdmin}
                    </div>`;
            });
        }
    }

    function startEdit(id, perm, jenis, desk) {
        switchTab('form-pengadaan');
        document.getElementById('edit-id-pengadaan').value = id;
        document.getElementById('deskripsi').value = desk;
        document.getElementById('btn-cancel-edit').classList.remove('hidden');
        document.getElementById('foto1').required = false; 
        
        if (jenis === 'Manual') { document.getElementById('item-list').value = 'Lainnya'; document.getElementById('item-manual').value = perm; } 
        else { document.getElementById('item-list').value = perm; }
        toggleManualInput();
        Swal.fire({icon: 'info', title: 'Edit Mode', text: 'Upload foto baru hanya jika ingin mengganti foto lama', timer:2000});
    }

    function cancelEdit() {
        document.getElementById('form-submit').reset();
        document.getElementById('edit-id-pengadaan').value = "";
        document.getElementById('btn-cancel-edit').classList.add('hidden');
        document.getElementById('foto1').required = true;
        [1,2,3].forEach(i => removePhoto(i));
        toggleManualInput();
    }

    async function actionAdmin(id, status) {
        const { value: ket } = await Swal.fire({ title: status, input: 'text', inputPlaceholder: 'Catatan admin...', showCancelButton: true });
        if (ket !== undefined) {
            Swal.fire({ title: 'Memproses...', didOpen: () => Swal.showLoading() });
            const res = await apiCall({ action: 'update_status', id: id, status: status, keterangan: ket, nik: currentUser.nik, nama: currentUser.nama, ip: globalIP, lokasi: globalLoc });
            if (res.status === 'success') { Swal.fire('Berhasil!', '', 'success'); loadData(true); }
        }
    }
</script>
</body>
</html>
